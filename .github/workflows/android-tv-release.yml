name: Android universal APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-tv-release.yml"
  push:
    branches: [fix/android-tv-release-pipeline]
    paths:
      - "android/**"
      - ".github/workflows/android-tv-release.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-universal-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure release signing when secrets are available
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jaiflix-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jaiflix-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Require signing key for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing required Actions secret: $name"; exit 1; fi
          done

      - name: Build debug and release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
        working-directory: android

      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ -f android/app/build/outputs/apk/release/app-release.apk ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/JAIFLIX-universal.apk
          elif [[ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/JAIFLIX-universal-unsigned.apk
          else
            echo "No release APK was produced"; exit 1
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/JAIFLIX-debug.apk

      - name: Verify signed release APK on tagged builds
        if: startsWith(github.ref, 'refs/tags/')
        run: apksigner verify --verbose dist/JAIFLIX-universal.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JAIFLIX-Android-TV-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JAIFLIX-universal.apk
          generate_release_notes: true
